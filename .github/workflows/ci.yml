name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push that lands while an earlier one is still running makes the earlier run
# pointless: it would publish a commit that is no longer the head of main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, build, deploy
    runs-on: ubuntu-latest
    # The deploy is the last step of this job rather than a job of its own so
    # that `dist` never has to travel between runners. Splitting them buys a
    # second green tick in the UI and costs an artifact upload, a download, and
    # a version-compatibility rule between two actions.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Not `npm ci`, and not cached: this repository does not track
      # `package-lock.json` (see `.gitignore`), and both of those need one. The
      # cost is that CI resolves the semver ranges in `package.json` afresh on
      # every run, so an upstream patch release can turn a green branch red
      # without a commit. Track the lockfile and this becomes `npm ci`.
      - run: npm install --no-audit --no-fund

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      # Pull requests get everything above and stop here. Only main is
      # published, and only after the three steps that could have caught it.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=namerek-business-card
