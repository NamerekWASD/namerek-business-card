name: CI

# A push to main is only checked; the site is published from a version tag
# (`git tag v1.2.0 && git push origin v1.2.0`), so a run of small commits does
# not go live one by one.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# A push that lands while an earlier one is still running makes the earlier run
# pointless: it would check a commit that is no longer the head of main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, build, deploy
    runs-on: ubuntu-latest
    # The deploy is the last step of this job rather than a job of its own so
    # that `dist` never has to travel between runners. Splitting them buys a
    # second green tick in the UI and costs an artifact upload, a download, and
    # a version-compatibility rule between two actions.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # `npm ci` rather than `npm install`, which is the whole reason the
      # lockfile is tracked: it installs the resolved tree exactly, so a run is
      # reproducible and an upstream patch release cannot redden a branch that
      # nobody touched. It also refuses outright if the lockfile and
      # `package.json` disagree — `pipeline.test.js` checks that locally, before
      # the push that would otherwise find out.
      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      # The built site in WebKit, the engine of every iPhone browser. It is
      # always about the newest Safari, so old-Safari syntax is caught earlier,
      # by `browserFloor.test.js` inside `npm run test`.
      - run: npx playwright install --with-deps webkit

      - run: npm run test:webkit

      # Pull requests and pushes to main get everything above and stop here.
      # Only a version tag is published, and only after the steps that could
      # have caught it.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=namerek-business-card
