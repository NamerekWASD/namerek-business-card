  <title
     id="title1">Namerek logo concept — N with flared stroke ends, break on the right vertical, and convergence point inscribed in a halo</title>
  <desc
     id="desc1">Bold letter N with small flared feet at the ends of each stroke. The extended lines of the left vertical and of the diagonal converge at one point above the letter; that point and both bottom corners sit on one faint construction circle. The diagonal breaks off as a notch cut into the right vertical, following the diagonal's own angle, with a dashed guide line continuing that trajectory.</desc>
